<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake Squad</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Study stimulus: keep it out of search results. -->
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#273B5E">
<!-- iOS still reads these; without them Add to Home Screen opens in a browser tab. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake Squad">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="root"></div>
<!-- Hidden researcher access from any screen: triple-tap the top-right corner. -->
<div id="researcher-hotspot" aria-hidden="true"></div>
<div id="sheet-host"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
